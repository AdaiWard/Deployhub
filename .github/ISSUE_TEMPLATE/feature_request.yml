name: Feature request
description: Suggest an improvement to DeployHub.
title: "feat: "
labels:
  - enhancement
body:
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: What deployment problem are you trying to solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior you would like to see.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Mention any workarounds or other approaches you considered.

  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This request is related to DeployHub and not to a deployed application.
          required: true
